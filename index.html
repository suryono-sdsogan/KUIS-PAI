<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis PAI Cerdas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --teal: #0d9488; --ink: #1e293b; --muted: #64748b; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #052e2b, #0f766e 45%, #115e59);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 14px; color: var(--ink);
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(255,255,255,.07) 0 2px, transparent 2px),
      radial-gradient(circle at 75% 70%, rgba(255,255,255,.05) 0 3px, transparent 3px);
    background-size: 46px 46px, 70px 70px;
  }
  .app {
    position: relative; width: 100%; max-width: 620px;
    background: #fffdf7; border-radius: 28px; padding: 24px;
    max-height: 94vh; overflow-y: auto;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    scrollbar-width: thin;
  }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp .35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  .hero { text-align: center; padding: 18px 0 6px; }
  .hero-emblem {
    width: 104px; height: 104px; margin: 0 auto 16px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    background: linear-gradient(135deg, #14b8a6, #0d9488 60%, #065f46);
    box-shadow: 0 12px 26px rgba(13,148,136,.4), inset 0 -4px 0 rgba(0,0,0,.15);
    animation: pop .5s ease;
  }
  .hero h1 {
    font-size: 2rem; line-height: 1.15; letter-spacing: -.5px;
    background: linear-gradient(120deg, #0d9488, #0f766e 50%, #065f46);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); font-size: .92rem; margin-top: 8px; line-height: 1.5; }
  .hero-badge {
    display: inline-block; margin-top: 14px; padding: 6px 14px;
    background: #ecfdf5; color: #047857; border-radius: 99px;
    font-size: .8rem; font-weight: 700;
  }
  .btn {
    font-family: inherit; font-weight: 700; cursor: pointer; border: none;
    border-radius: 16px; transition: transform .12s, filter .15s, background .15s;
  }
  .btn-main {
    width: 100%; padding: 17px; font-size: 1.08rem; color: #fff;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    box-shadow: 0 6px 0 #0f766e; margin-top: 22px;
  }
  .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #0f766e; }
  .btn-ghost {
    width: 100%; padding: 15px; font-size: 1rem; margin-top: 10px;
    background: #f1f5f9; color: #334155;
  }
  .btn-ghost:hover { background: #e2e8f0; }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .back {
    width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; border: none;
    background: #f1f5f9; color: #475569; font-size: 1.1rem; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .back:hover { background: #e2e8f0; }
  .head h2 { font-size: 1.2rem; color: #0f766e; }
  .head-sub { color: var(--muted); font-size: .85rem; margin: 4px 0 18px 48px; }

  .kelas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kelas-card {
    position: relative; overflow: hidden; border: none; cursor: pointer;
    border-radius: 18px; padding: 20px 8px 16px; color: #fff;
    font-family: inherit; text-align: center;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 5px 0 rgba(0,0,0,.18);
  }
  .kelas-card:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  .kelas-card:active { transform: translateY(1px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .kelas-card .num { font-size: 2.1rem; font-weight: 800; line-height: 1; }
  .kelas-card .lbl { font-size: .74rem; font-weight: 700; opacity: .92; margin-top: 4px; letter-spacing: .5px; }
  .kelas-card::after {
    content: ''; position: absolute; right: -22px; top: -22px;
    width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.18);
  }

  .materi-list { display: grid; gap: 11px; }
  .materi-card {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 15px 16px; border-radius: 18px; cursor: pointer;
    border: 2px solid transparent; background: #fff;
    font-family: inherit; text-align: left;
    box-shadow: 0 3px 10px rgba(0,0,0,.07);
    transition: transform .13s, border-color .15s;
  }
  .materi-card:hover { transform: translateX(4px); }
  .materi-ico {
    width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.45rem;
    color: #fff;
  }
  .materi-body { flex: 1; min-width: 0; }
  .materi-name { font-weight: 800; font-size: 1rem; color: #1e293b; }
  .materi-desc { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .materi-count {
    flex-shrink: 0; font-size: .72rem; font-weight: 800; padding: 5px 10px;
    border-radius: 99px; background: #f1f5f9; color: #64748b;
  }
  .materi-count.has { background: #dcfce7; color: #15803d; }

  .quiz-top { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 800; color: #94a3b8; margin-bottom: 8px; align-items: center; }
  .quiz-top b { color: var(--teal); }
  .timer-badge {
    background: #fef2f2; color: #dc2626; padding: 4px 10px; border-radius: 99px;
    border: 1px solid #fecaca; display: flex; align-items: center; gap: 4px;
  }
  .timer-badge.warning { animation: blink 1s infinite; background: #fee2e2; }
  
  .bar { height: 9px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg,#2dd4bf,#0d9488); transition: width .35s; }
  .qcard {
    background: linear-gradient(135deg, #f0fdfa, #ecfdf5);
    border: 2px solid #ccfbf1; border-radius: 20px; padding: 20px 18px; margin-bottom: 18px;
  }
  .qcard .qtext { font-size: 1.1rem; font-weight: 800; line-height: 1.5; color: #134e4a; }
  .options { display: grid; gap: 11px; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 15px 16px; border: none; border-radius: 16px; cursor: pointer;
    font-family: inherit; font-size: 1rem; font-weight: 700; text-align: left;
    color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.16);
    transition: transform .12s, filter .15s, opacity .25s;
  }
  .opt:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
  .opt:disabled { cursor: default; }
  .opt .badge {
    width: 27px; height: 27px; flex-shrink: 0; border-radius: 50%;
    background: rgba(255,255,255,.3); display: flex; align-items: center;
    justify-content: center; font-size: .82rem;
  }
  .opt.dim { opacity: .3; }
  .opt.correct { background: #16a34a !important; opacity: 1; transform: scale(1.02); }
  .opt.wrong { background: #b91c1c !important; opacity: 1; animation: shake .3s; }
  .feedback { margin-top: 15px; padding: 14px 16px; border-radius: 14px; font-size: .9rem; line-height: 1.55; display: none; }
  .feedback.show { display: block; animation: fadeUp .25s; }
  .feedback.ok { background: #dcfce7; border-left: 5px solid #22c55e; }
  .feedback.no { background: #fee2e2; border-left: 5px solid #ef4444; }
  .fb-title { font-weight: 800; margin-bottom: 3px; }
  .next-btn {
    width: 100%; margin-top: 15px; padding: 15px; border: none; border-radius: 16px;
    font-family: inherit; font-size: 1.02rem; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg,#14b8a6,#0d9488); box-shadow: 0 5px 0 #0f766e;
    display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f766e; }

  .result { text-align: center; padding: 8px 0; }
  .result-emoji { font-size: 3.4rem; animation: pop .5s ease; }
  .result-score {
    font-size: 3rem; font-weight: 900; margin: 6px 0;
    background: linear-gradient(120deg,#0d9488,#065f46);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .result-stars { font-size: 1.6rem; letter-spacing: 6px; margin-bottom: 10px; }
  .result-msg { color: var(--muted); font-size: .95rem; line-height: 1.55; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="app">

  <section id="scrSplash" class="screen active">
    <div class="hero">
      <div class="hero-emblem">🕌</div>
      <h1>Kuis PAI Cerdas</h1>
      <p>Belajar Pendidikan Agama Islam jadi seru!<br>Pilih kelasmu dan taklukkan setiap soal.</p>
      <div class="hero-badge" id="totalBadge">Memuat soal…</div>
    </div>
    <button class="btn btn-main" onclick="mulaiBelajar()">🚀 Mulai Belajar</button>
  </section>

  <section id="scrKelas" class="screen">
    <div class="head">
      <button class="back" onclick="showScreen('scrSplash')">←</button>
      <h2 id="kelasTitle">Pilih Kelas</h2>
    </div>
    <p class="head-sub" id="kelasSub">Mau belajar materi PAI untuk kelas berapa?</p>
    <div class="kelas-grid" id="kelasGrid"></div>
  </section>

  <section id="scrMateri" class="screen">
    <div class="head">
      <button class="back" onclick="showScreen('scrKelas')">←</button>
      <h2 id="materiTitle">Pilih Materi</h2>
    </div>
    <p class="head-sub" id="materiSub">Kelas 1</p>
    <div class="materi-list" id="materiList"></div>
  </section>

  <section id="scrQuiz" class="screen">
    <div class="quiz-top">
      <span>Soal <b id="qNum">1</b>/<b id="qTotal">10</b></span>
      <span>Skor <b id="qScore">0</b></span>
      <div class="timer-badge" id="timerBadge">⏱️ <b id="qTimer">30</b>s</div>
    </div>
    <div class="bar"><div class="bar-fill" id="qBar"></div></div>
    <div class="qcard"><div class="qtext" id="qText">…</div></div>
    <div class="options" id="qOptions"></div>
    <div class="feedback" id="qFeedback"></div>
    <button class="next-btn" id="qNext" onclick="nextQuestion()">Lanjut ➜</button>
  </section>

  <section id="scrHasil" class="screen">
    <div class="result">
      <div class="result-emoji" id="rEmoji">🎉</div>
      <div class="result-score" id="rScore">0</div>
      <div class="result-stars" id="rStars">⭐</div>
      <p class="result-msg" id="rMsg"></p>
    </div>

    <div id="kirimBox" style="background:#f0fdfa;border:2px solid #ccfbf1;border-radius:16px;padding:16px;margin-bottom:14px;">
      <label style="display:block;font-size:.82rem;font-weight:800;color:#475569;margin-bottom:6px;">
        Nama Lengkap
      </label>
      <input id="inpNama" type="text" placeholder="Contoh: Ahmad Fauzi"
             style="width:100%;padding:12px 14px;font-family:inherit;font-size:.95rem;border:2px solid #e2e8f0;border-radius:12px;margin-bottom:12px;">
      <button class="btn btn-main" style="margin-top:0" onclick="kirimNilai()" id="btnKirim">
        📤 Kirim Nilai ke Guru
      </button>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="tesKoneksi()" id="btnTes">
        🔍 Tes Koneksi Server
      </button>
      <p id="statusKirim" style="font-size:.82rem;color:#64748b;margin-top:10px;text-align:center;line-height:1.55;"></p>
    </div>

    <button class="btn btn-ghost" onclick="ulangiKuis()">🔄 Main Lagi</button>
    <button class="btn btn-ghost" onclick="showScreen('scrMateri')">📚 Pilih Materi Lain</button>
    <button class="btn btn-ghost" onclick="showScreen('scrSplash')">🏠 Menu Utama</button>
  </section>

</div>
<script>
/* ============================================================
   ⚙️ KONFIGURASI
   ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxaOAZ5jLZP4m86pH8i_ySNzfZ3xm7KJCyvM-K40z7d7M1RQLVRHiZaG7nkojbc2zrDdQ/exec';
const WAKTU_PER_SOAL = 30;

/* ============================================================
   1. DATA DASAR (SEMESTER 1 & 2)
   ============================================================ */
const MATERI_META = [
  { id:'quran1',  nama:"Al-Qur'an & Hadits 1", icon:'📖', c1:'#3b82f6', c2:'#1d4ed8', desc:'Semester 1 - Al-Qur\'an & Hadits' },
  { id:'quran2',  nama:"Al-Qur'an & Hadits 2", icon:'📖', c1:'#3b82f6', c2:'#1d4ed8', desc:'Semester 2 - Al-Qur\'an & Hadits' },
  { id:'akidah1', nama:'Akidah 1',            icon:'☪️', c1:'#a855f7', c2:'#7e22ce', desc:'Semester 1 - Akidah & Tauhid' },

  { id:'fikih1',  nama:'Fikih 1',             icon:'🕌', c1:'#10b981', c2:'#047857', desc:'Semester 1 - Fikih & Ibadah' },
  { id:'fikih2',  nama:'Fikih 2',             icon:'🕌', c1:'#10b981', c2:'#047857', desc:'Semester 2 - Fikih & Ibadah' },
  { id:'spi1',    nama:'SPI 1',               icon:'📜', c1:'#ef4444', c2:'#b91c1c', desc:'Semester 1 - Sejarah Peradaban Islam' },
  { id:'spi2',    nama:'SPI 2',               icon:'📜', c1:'#ef4444', c2:'#b91c1c', desc:'Semester 2 - Sejarah Peradaban Islam' }
];

const KELAS_GRADIENTS = [
  ['#38bdf8','#0284c7'], ['#34d399','#059669'], ['#fbbf24','#d97706'],
  ['#fb923c','#ea580c'], ['#a78bfa','#7c3aed'], ['#f472b6','#db2777']
];

const OPT_COLORS = ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6'];
const OPT_LETTERS = ['A','B','C','D'];

/* ============================================================
   2. BANK SOAL (KELAS 1 - 6 SUDAH TERISI)
   ============================================================ */
const DEFAULT_BANK = {
"1-quran1": [
  { q:"Huruf hijaiyah adalah huruf yang digunakan dalam kitab suci ....", correct:"Al-Qur'an", wrong:["Injil","Taurat","Zabur"], exp:"Al-Qur'an diturunkan dalam bahasa Arab yang tersusun dari huruf hijaiyah." },
  { q:"Jumlah seluruh huruf hijaiyah ada ....", correct:"29", wrong:["20","50","30"], exp:"Huruf hijaiyah berjumlah 29, dimulai dari alif hingga ya." },
  { q:"Cara membaca huruf hijaiyah dimulai dari arah ....", correct:"Kanan ke kiri", wrong:["Kiri ke kanan","Atas ke bawah","Bawah ke atas"], exp:"Tulisan Arab dibaca dari arah kanan menuju kiri." },
  { q:"Harakat fathah dilambangkan dengan garis ....", correct:"Miring di atas", wrong:["Miring di bawah","Melengkung seperti wau","Lurus di tengah"], exp:"Fathah berbunyi 'a' dan terletak di atas huruf." },

  { q:"Huruf مِ dibaca ....", correct:"Mi", wrong:["Ma","Mu","Man"], exp:"Huruf mim yang berharakat kasrah dibaca 'mi'." },
  { q:"Huruf تُ dibaca ....", correct:"Tu", wrong:["Ta","Ti","Tan"], exp:"Huruf ta yang berharakat dhammah dibaca 'tu'." },

  { q:"Ar-Rahman artinya Allah Maha ....", correct:"Pengasih", wrong:["Penyayang","Perkasa","Kuasa"], exp:"Ar-Rahman berarti Allah Maha Pengasih kepada seluruh makhluk-Nya." },
  { q:"Ar-Rahim artinya Allah Maha ....", correct:"Penyayang", wrong:["Pengasih","Pencipta","Mendengar"], exp:"Ar-Rahim berarti Allah Maha Penyayang khususnya kepada orang-orang beriman." },

  { q:"Kita bisa hidup sehat karena Allah Maha ....", correct:"Penyayang", wrong:["Pemarah","Penghukum","Pembenci"], exp:"Kesehatan adalah salah satu wujud sayang Allah kepada kita." },
  { q:"Allah selalu memberikan kita makanan dan minuman. Ini membuktikan Allah bersifat ....", correct:"Ar-Rahman dan Ar-Rahim", wrong:["Al-Malik","Al-Hakim","Al-Quddus"], exp:"Rezeki yang melimpah menunjukkan sifat pengasih dan penyayang Allah." },

/* ============================================================
   3. STATE & UTILITAS
   ============================================================ */
let bank = JSON.parse(JSON.stringify(DEFAULT_BANK));
let state = { kelas: null, materi: null };
let kuis = [], qi = 0, skor = 0, streak = 0, terjawab = false;
let waktuMulai = 0;
let timerInterval;
let timeLeft = WAKTU_PER_SOAL;

function keyOf(kelas, materi) { return kelas + '-' + materi; }
function getSoal(kelas, materi) { return bank[keyOf(kelas, materi)] || []; }

function hitungTotal() {
  let n = 0;
  for (const k in bank) if (Array.isArray(bank[k])) n += bank[k].length;
  return n;
}
function updateTotalBadge() {
  document.getElementById('totalBadge').textContent = `📚 ${hitungTotal()} soal siap dimainkan`;
}

function shuffle(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector('.app').scrollTop = 0;
}

/* ============================================================
   4. ALUR NAVIGASI
   ============================================================ */
function mulaiBelajar() {
  renderKelas();
  showScreen('scrKelas');
}

function renderKelas() {
  const grid = document.getElementById('kelasGrid');
  grid.innerHTML = '';
  for (let k = 1; k <= 6; k++) {
    const [c1, c2] = KELAS_GRADIENTS[k - 1];
    const btn = document.createElement('button');
    btn.className = 'kelas-card';
    btn.style.background = `linear-gradient(140deg, ${c1}, ${c2})`;
    btn.innerHTML = `<div class="num">${k}</div><div class="lbl">KELAS</div>`;
    btn.onclick = () => pilihKelas(k);
    grid.appendChild(btn);
  }
}

function pilihKelas(k) {
  state.kelas = k;
  renderMateri();
  showScreen('scrMateri');
}

function renderMateri() {
  const k = state.kelas;
  document.getElementById('materiSub').textContent = `Kelas ${k} — pilih materi yang ingin dipelajari.`;

  const list = document.getElementById('materiList');
  list.innerHTML = '';

  MATERI_META.forEach(m => {
    const jumlah = getSoal(k, m.id).length;
    const btn = document.createElement('button');
    btn.className = 'materi-card';
    btn.style.borderColor = m.c1 + '33';
    btn.innerHTML = `
      <div class="materi-ico" style="background:linear-gradient(140deg,${m.c1},${m.c2})">${m.icon}</div>
      <div class="materi-body">
        <div class="materi-name">${m.nama}</div>
        <div class="materi-desc">${m.desc}</div>
      </div>
      <div class="materi-count ${jumlah ? 'has' : ''}">${jumlah ? jumlah + ' soal' : 'kosong'}</div>`;
    btn.onclick = () => pilihMateri(m.id);
    list.appendChild(btn);
  });
}

function pilihMateri(id) {
  state.materi = id;
  mulaiKuis();
}

/* ============================================================
   5. KUIS & TIMER (DENGAN ATURAN DINAMIS)
   ============================================================ */
function mulaiKuis() {
  const semua = getSoal(state.kelas, state.materi);

  if (semua.length === 0) {
    alert('Materi ini belum punya soal. Silakan pilih materi lain.');
    return;
  }

  // ✅ ATURAN DINAMIS: Kelas 1 & 2 = 10 soal, Kelas 3-6 = 20 soal
  const batasSoal = (state.kelas === 1 || state.kelas === 2) ? 10 : 20;
  
  // Ambil soal secara acak sebanyak batasSoal
  kuis = shuffle(semua).slice(0, batasSoal);
  
  qi = 0; skor = 0; streak = 0;
  waktuMulai = Date.now();
  showScreen('scrQuiz');
  tampilkanSoal();
}

function ulangiKuis() {
  mulaiKuis();
}

function tampilkanSoal() {
  terjawab = false;
  const s = kuis[qi];

  document.getElementById('qNum').textContent = qi + 1;
  document.getElementById('qTotal').textContent = kuis.length;
  document.getElementById('qScore').textContent = skor;
  document.getElementById('qBar').style.width = (qi / kuis.length * 100) + '%';
  document.getElementById('qText').innerHTML = s.q;

  const pilihan = shuffle([s.correct, ...s.wrong]);
  const box = document.getElementById('qOptions');
  box.innerHTML = '';

  pilihan.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.style.background = `linear-gradient(135deg, ${OPT_COLORS[i]}, ${OPT_COLORS[i]}cc)`;
    btn.innerHTML = `<span class="badge">${OPT_LETTERS[i]}</span><span>${esc(opt)}</span>`;
    btn.onclick = () => jawab(btn, opt, s);
    box.appendChild(btn);
  });

  const fb = document.getElementById('qFeedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
  document.getElementById('qNext').classList.remove('show');

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = WAKTU_PER_SOAL;
  updateTimerDisplay();
  
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      waktuHabis();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const timerBadge = document.getElementById('timerBadge');
  const qTimer = document.getElementById('qTimer');
  qTimer.textContent = timeLeft;
  
  if (timeLeft <= 5) {
    timerBadge.classList.add('warning');
  } else {
    timerBadge.classList.remove('warning');
  }
}

function waktuHabis() {
  if (terjawab) return;
  terjawab = true;
  
  const s = kuis[qi];
  const semuaBtn = document.querySelectorAll('#qOptions .opt');
  semuaBtn.forEach(b => {
    b.disabled = true;
    const teks = b.querySelector('span:last-child').innerHTML;
    if (teks === s.correct) b.classList.add('correct');
    else b.classList.add('dim');
  });

  streak = 0;

  const fb = document.getElementById('qFeedback');
  fb.className = 'feedback show no';
  fb.innerHTML = `<div class="fb-title">⏰ Waktu Habis!</div>` +
    (s.exp ? `<div>${esc(s.exp)}</div>` : '');

  const next = document.getElementById('qNext');
  next.classList.add('show');
  next.textContent = (qi === kuis.length - 1) ? 'Lihat Hasil ➜' : 'Lanjut ➜';
}

function jawab(btn, opt, s) {
  if (terjawab) return;
  terjawab = true;
  clearInterval(timerInterval);

  const benar = opt === s.correct;

  const semuaBtn = document.querySelectorAll('#qOptions .opt');
  semuaBtn.forEach(b => {
    b.disabled = true;
    const teks = b.querySelector('span:last-child').innerHTML;
    if (teks === s.correct) b.classList.add('correct');
    else b.classList.add('dim');
  });

  if (benar) { skor += 10; streak++; }
  else { streak = 0; btn.classList.remove('dim'); btn.classList.add('wrong'); }

  document.getElementById('qScore').textContent = skor;

  const fb = document.getElementById('qFeedback');
  fb.className = 'feedback show ' + (benar ? 'ok' : 'no');
  fb.innerHTML =
    `<div class="fb-title">${benar ? '✅ Benar! +10 poin' : '❌ Belum tepat'}</div>` +
    (s.exp ? `<div>${esc(s.exp)}</div>` : '');

  const next = document.getElementById('qNext');
  next.classList.add('show');
  next.textContent = (qi === kuis.length - 1) ? 'Lihat Hasil ➜' : 'Lanjut ➜';
}

function nextQuestion() {
  qi++;
  if (qi >= kuis.length) {
    clearInterval(timerInterval);
    tampilkanHasil();
  } else {
    tampilkanSoal();
  }
}

function tampilkanHasil() {
  const maks = kuis.length * 10;
  const persen = Math.round(skor / maks * 100);

  let emoji = '💪', bintang = '⭐', msg = 'Terus semangat belajar ya!';
  if (persen === 100) { emoji = '🏆'; bintang = '⭐⭐⭐'; msg = 'Sempurna! Masya Allah, luar biasa!'; }
  else if (persen >= 80) { emoji = '🎉'; bintang = '⭐⭐⭐'; msg = `Hebat sekali! ${persen}% jawaban benar. Sedikit lagi sempurna!`; }
  else if (persen >= 60) { emoji = '🌟'; bintang = '⭐⭐'; msg = `Bagus! ${persen}% jawaban benar. Tingkatkan lagi ya!`; }
  else if (persen >= 40) { emoji = '👍'; bintang = '⭐'; msg = `Skor ${persen}%. Ayo baca lagi materinya dan coba sekali lagi!`; }
  else { emoji = '💪'; bintang = '⭐'; msg = `Skor ${persen}%. Jangan menyerah, terus belajar!`; }

  document.getElementById('rEmoji').textContent = emoji;
  document.getElementById('rScore').textContent = `${skor} / ${maks}`;
  document.getElementById('rStars').textContent = bintang;
  document.getElementById('rMsg').textContent = msg;

  const inp = document.getElementById('inpNama');
  const btnK = document.getElementById('btnKirim');
  inp.disabled = false;
  inp.value = '';
  btnK.disabled = false;
  btnK.textContent = '📤 Kirim Nilai ke Guru';
  const st = document.getElementById('statusKirim');
  st.textContent = '';
  st.style.color = '#64748b';

  showScreen('scrHasil');
}

/* ============================================================
   6. KIRIM NILAI & TES KONEKSI
   ============================================================ */
function kirimNilai() {
  const nama = document.getElementById('inpNama').value.trim();
  const status = document.getElementById('statusKirim');
  const btn = document.getElementById('btnKirim');

  if (nama.length < 2) {
    status.textContent = '⚠️ Isi nama dulu ya!';
    status.style.color = '#dc2626';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Mengirim…';
  status.innerHTML = 'Mengirim ke server…';
  status.style.color = '#64748b';

  const materiNama = (MATERI_META.find(m => m.id === state.materi) || {}).nama || '-';
  const maks = kuis.length * 10;
  const persen = Math.round(skor / maks * 100);
  const durasi = Math.round((Date.now() - waktuMulai) / 1000);

  const payload = { nama, kelas: state.kelas, materi: materiNama, skor, maks, persen, durasi };

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(txt => {
    console.log('Server response:', txt);
    let data;
    try {
      data = JSON.parse(txt);
    } catch (e) {
      throw new Error('Server tidak membalas JSON. Kemungkinan deployment belum "Anyone" atau belum di-deploy ulang.');
    }
    if (!data.ok) throw new Error(data.error || 'Server menolak data');

    status.innerHTML = '✅ <b>Nilai TERVERIFIKASI tersimpan di baris ' + (data.row || '?') + ' spreadsheet!</b>';
    status.style.color = '#059669';
    btn.textContent = '✅ Terkirim';
    document.getElementById('inpNama').disabled = true;
  })
  .catch(err => {
    console.error('Kirim gagal:', err);
    status.innerHTML = '❌ <b>GAGAL:</b> ' + err.message + '<br><small>Klik 🔍 Tes Koneksi untuk diagnosa.</small>';
    status.style.color = '#dc2626';
    btn.disabled = false;
    btn.textContent = '📤 Coba Kirim Lagi';
  });
}

function tesKoneksi() {
  const status = document.getElementById('statusKirim');
  status.innerHTML = '⏳ Menguji koneksi ke server…';
  status.style.color = '#64748b';

  fetch(APPS_SCRIPT_URL, { method: 'GET' })
    .then(r => {
      if (!r.ok) throw new Error('Server membalas status ' + r.status);
      return r.text();
    })
    .then(txt => {
      if (txt.includes('aktif')) {
        status.innerHTML = '✅ <b>Server terhubung!</b><br>Sekarang coba klik "Kirim Nilai".';
        status.style.color = '#059669';
      } else {
        status.innerHTML = '⚠️ <b>Server bisa diakses tapi respons tidak sesuai.</b><br>Respons: ' + txt.substring(0, 100);
        status.style.color = '#d97706';
      }
    })
    .catch(err => {
      status.innerHTML = '❌ <b>KONEKSI GAGAL.</b><br>' + err.message + '<br><br>Kemungkinan penyebab:<br>1. Deployment belum di-set "Anyone"<br>2. URL di HTML salah<br>3. Belum di-deploy';
      status.style.color = '#dc2626';
    });
}

updateTotalBadge();
